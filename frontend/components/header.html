<header class="site-header">
    <div class="header-container container">
        <div class="logo">
            <a href="/index.html" aria-label="FastBuy home">
                <img src="/assets/images/brand-logo-header.svg" alt="FastBuy" class="brand-logo-img">
            </a>
        </div>

        <nav class="header-nav" aria-label="Main navigation">
            <ul class="nav-primary">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/pages/shop.html">Shop</a></li>
                <li><a href="/pages/about.html">About</a></li>
                <li><a href="/pages/contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="/pages/shop.html" class="header-action-btn" aria-label="Search products" title="Search">
                <i class="fas fa-search"></i>
            </a>
            <a href="/pages/cart.html" id="cartIconLink" class="header-action-btn" aria-label="Cart">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" class="cart-count" hidden>0</span>
            </a>
            <div class="header-auth">
                <a href="/pages/login.html" id="loginListItem" class="btn btn-ghost btn-sm">Sign in</a>

                    <a href="/pages/orders.html" class="nav-auth-link">Orders</a>
                    <a href="/pages/admin.html" id="adminLink" class="nav-auth-link is-hidden">Admin</a>
                    <a href="#" id="logoutLink" class="nav-auth-link">Logout</a>
                </div>
            </div>
        </div>

        <button class="hamburger" aria-label="Toggle menu" aria-expanded="false" onclick="toggleMenu(this)">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>
        <div class="overlay" onclick="closeMenu()"></div>
    </div>
