<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your profile - FastBuy">
    <title>My Profile | FastBuy</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <!-- <link rel="stylesheet" href="../assets/css/components.css"> -->
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.jpg">
</head>
<body>

    <div id="header"></div>

    <main class="profile-main">
        <div class="container profile-container">
            <h1 class="profile-title">My Profile</h1>

            <div class="profile-grid">
                <!-- Profile Information Section -->
                <div class="profile-card">
                    <h2>Personal Information</h2>
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <button type="submit" id="update-profile-btn" class="btn btn-primary">Update Profile</button>
                        <div id="profile-message" class="form-message"></div>
                    </form>
                </div>

                <!-- Change Password Section -->
                <div class="profile-card">
                    <h2>Change Password</h2>
                    <form id="password-form">
                        <div class="form-group">
                            <label for="current-password">Current Password</label>
                            <input type="password" id="current-password" name="currentPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password" name="newPassword" required>
                            <small>Minimum 6 characters</small>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm New Password</label>
                            <input type="password" id="confirm-password" name="confirmPassword" required>
                        </div>
                        <button type="submit" id="change-password-btn" class="btn btn-secondary">Change Password</button>
                        <div id="password-message" class="form-message"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- <div id="footer"></div> -->

    <script src="../assets/js/hamburger.js"></script>
    <script src="../assets/js/loaderScript.js"></script>
    <script src="../assets/js/profile.js"></script>
</body>
</html>
