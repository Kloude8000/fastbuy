<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.fontawesome.com; font-src 'self' https://fonts.gstatic.com https://use.fontawesome.com data:; img-src 'self' data: https: http:; connect-src 'self' http://localhost:5000 https://fastbuy-iewu.onrender.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <meta name="description" content="Create a FastBuy account">
    <title>Register | FastBuy</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo-icon.svg">
</head>
<body class="auth-page-body">

    <div class="auth-page">
        <aside class="auth-brand">
            <a href="/index.html" class="auth-brand-logo">
                <img src="/assets/images/brand-logo.svg" alt="FastBuy">
            </a>
            <h1>Join FastBuy</h1>
            <p>Create an account for faster checkout, order tracking, and exclusive offers.</p>
        </aside>

        <div class="auth-panel">
            <div class="auth-card">
                <h2>Create account</h2>
                <p class="subtitle">It only takes a minute</p>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name">
                        <small class="error-message" id="nameError"></small>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                        <small class="error-message" id="emailError"></small>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Min. 6 characters" autocomplete="new-password">
                        <small class="error-message" id="passwordError"></small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password">
                        <small class="error-message" id="confirmError"></small>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Register</button>
                </form>

                <div id="messageContainer"></div>
                <div class="login-link">
                    Already have an account? <a href="/pages/login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/register.js"></script>
</body>
</html>
