<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.fontawesome.com; font-src 'self' https://fonts.gstatic.com https://use.fontawesome.com data:; img-src 'self' data: https: http:; connect-src 'self' http://localhost:5000 https://fastbuy-iewu.onrender.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <meta name="description" content="Product details - FastBuy">
    <title>Product | FastBuy</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/product.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css" integrity="sha384-oS3vJWv+0UjzBfQzYUhtDYW+Pj2yciDJxpsK1OYPAYjqT085Qq/1cq5FLXAZQ7Ay" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo-icon.svg">
</head>
<body>

    <div id="header"></div>

    <main class="page-main product-page">
        <div class="container">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <ol>
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="/pages/shop.html" id="breadcrumb-category">Products</a></li>
                    <li aria-current="page" id="breadcrumb-product">Loading...</li>
                </ol>
            </nav>

            <div class="product-detail" id="product-detail">
                <div class="product-gallery">
                    <img id="product-image" src="" alt="Product image" class="product-main-image">
                </div>
                <div class="product-info">
                    <h1 id="product-name">Loading...</h1>
                    <div class="product-rating">
                        <div class="stars" id="product-stars"></div>
                        <span id="product-review-count"></span>
                    </div>
                    <div class="product-pricing" id="product-pricing">
                        <span class="current-price"></span>
                        <span class="old-price"></span>
                    </div>
                    <div class="product-description" id="product-description"></div>
                    <div class="product-actions">
                        <div class="quantity-selector">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" name="quantity" value="1" min="1" max="99">
                        </div>
                        <button type="button" id="add-to-cart-btn" class="btn btn-primary btn-block">Add to Cart</button>
                    </div>
                    <div class="product-meta">
                        <p><strong>Category:</strong> <span id="product-category"></span></p>
                    </div>
                </div>
            </div>

            <section class="reviews-section surface-card">
                <h2 class="section-title">Customer reviews</h2>
                <div id="reviews-list" class="reviews-list">
                    <p class="loading-state">Loading reviews...</p>
                </div>
                <div id="write-review" class="write-review" style="display: none;">
                    <h3>Write a review</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label>Rating</label>
                            <div class="rating-input">
                                <span class="star" data-rating="1">&#9734;</span>
                                <span class="star" data-rating="2">&#9734;</span>
                                <span class="star" data-rating="3">&#9734;</span>
                                <span class="star" data-rating="4">&#9734;</span>
                                <span class="star" data-rating="5">&#9734;</span>
                            </div>
                            <input type="hidden" id="rating-value" name="rating" required>
                        </div>
                        <div class="form-group">
                            <label for="review-comment">Your review</label>
                            <textarea id="review-comment" name="comment" rows="4" required placeholder="Share your experience..."></textarea>
                        </div>
                        <button type="submit" id="submit-review-btn" class="btn btn-primary">Submit review</button>
                        <div id="review-message" class="form-message"></div>
                    </form>
                </div>
            </section>

            <section class="related-products">
                <h2 class="section-title">You may also like</h2>
                <div id="related-grid" class="related-grid"></div>
            </section>
        </div>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/hamburger.js"></script>
    <script src="../assets/js/loaderScript.js"></script>
    <script src="../assets/js/product.js"></script>
</body>
</html>
