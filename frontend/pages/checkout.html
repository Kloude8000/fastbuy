<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | FastBuy</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <!-- <link rel="stylesheet" href="../assets/css/components.css"> -->
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/checkout.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.jpg">
</head>
<body>

    <div id="header"></div>

    <main class="checkout-main">
        <div class="container checkout-container">
            <h1 class="checkout-title">Checkout</h1>

            <div class="checkout-grid">
                <!-- Shipping Form -->
                <div class="checkout-form">
                    <h2>Shipping Information</h2>
                    <form id="checkout-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullname">Full Name *</label>
                                <input type="text" id="fullname" name="fullname" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" required>
                            </div>
                            <div class="form-group">
                                <label for="postal">Postal Code *</label>
                                <input type="text" id="postal" name="postal" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone">
                        </div>

                        <h2>Payment Method</h2>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="cod" checked> Cash on Delivery
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="card" disabled> Credit Card (coming soon)
                            </label>
                        </div>

                        <button type="submit" id="place-order-btn" class="btn btn-primary btn-block">Place Order</button>
                    </form>
                </div>

                <!-- Order Summary -->
                <aside class="order-summary">
                    <h2>Your Order</h2>
                    <div id="order-items" class="order-items">
                        <p>Loading cart...</p>
                    </div>
                    <div class="order-total">
                        <span>Total</span>
                        <span id="order-total">$0.00</span>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- <div id="footer"></div> -->

    <script src="../assets/js/hamburger.js"></script>
    <script src="../assets/js/loaderScript.js"></script>
    <script src="../assets/js/checkout.js"></script>
</body>
</html>
